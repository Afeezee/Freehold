name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.11", "3.13"]
        exclude:
          # one Python per extra OS is enough; the matrix is about
          # catching platform differences, not re-running everything
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
          - { os: windows-latest, python: "3.9" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run the suite
        run: python -m pytest tests -q
        # No network and no credentials: the GitHub backend runs against an
        # in-memory API, and S3 against a local HTTP server.
