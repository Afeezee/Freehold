[project]
name = "freehold"
version = "0.1.0"
description = "Vendor-agnostic, client-encrypted, deduplicating backup for PC and mobile"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Afeez Olagunju" }]
keywords = ["backup", "encryption", "deduplication", "chunking", "restore",
            "github", "s3", "r2", "b2", "zero-knowledge"]
dependencies = ["cryptography>=42"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Archiving :: Backup",
  "Topic :: Security :: Cryptography",
]

license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/Afeezee/Freehold"
Documentation = "https://github.com/Afeezee/Freehold/tree/main/docs"
Recovery = "https://github.com/Afeezee/Freehold/blob/main/RECOVERY.md"
Issues = "https://github.com/Afeezee/Freehold/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
freehold = "freehold.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["freehold*"]

[tool.setuptools.package-data]
"freehold.dashboard" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
